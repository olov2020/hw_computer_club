apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: computer-club
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        ports:
        - containerPort: 5432
        envFrom:
        - secretRef:
            name: club-service-secret
        env:
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: club-service-config
              key: DB_NAME
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: computer-club
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
