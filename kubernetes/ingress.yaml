apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: club-service-ingress
  namespace: computer-club
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: computer-club.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: club-service
            port:
              number: 8080
